[project]
name = "drift-backend"
version = "0.1.0"
description = "Drift generative iteration genealogy API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "genblaze-core==0.3.8",
    "genblaze-gmicloud==0.3.5",
    "genblaze-s3==0.3.6",
    "httpx==0.28.1",
    "pandas==3.0.5",
    "Pillow==11.3.0",
    "pyarrow==25.0.0",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "uvicorn[standard]==0.52.1",
]

[tool.vercel]
entrypoint = "server:app"
